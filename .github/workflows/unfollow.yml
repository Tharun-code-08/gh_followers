name: Unfollow Non-Followers (3-day delay)

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC (09:30 IST), before the follow run
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list only, no unfollow)"
        required: false
        default: "false"

concurrency: follow-log

env:
  GH_USERNAME: ${{ secrets.GH_USERNAME }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  GRACE_DAYS: 3
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  unfollow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unfollow people from 3+ day old batches who didn't follow back
        run: python scripts/grow.py unfollow

      - name: Commit follow log
        run: |
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"
          git add follow-log.json
          git diff --cached --quiet || git commit -m "chore: unfollowed non-followers $(date -u '+%Y-%m-%d')"
          git push
