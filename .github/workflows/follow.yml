name: Daily Follow

on:
  schedule:
    - cron: "30 4 * * *" # daily at 04:30 UTC (10:00 IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list only, no follow)"
        required: false
        default: "false"

concurrency: follow-log

env:
  GH_USERNAME: ${{ secrets.GH_USERNAME }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DAILY_LIMIT: 20
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

jobs:
  follow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Follow up to 20 random active developers
        run: python scripts/grow.py follow

      - name: Commit follow log
        run: |
          git config user.name "${{ secrets.GH_USERNAME }}"
          git config user.email "${{ secrets.GH_EMAIL }}"
          git add follow-log.json
          git diff --cached --quiet || git commit -m "chore: followed new users $(date -u '+%Y-%m-%d')"
          git push
